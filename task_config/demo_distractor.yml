# isolates a single variable: tabletop distractors.
#
# differences from demo_clutter.yml (this is the entire design intent):
#   random_background     true  -> false   appearance randomization is the recorded cause
#   random_light          true  -> false   of beat_block_hammer's frozen baseline dropping
#   random_table_height   0.03  -> 0       to 2/100; all of it turned off.
#   cluttered_table       true  -> true    only this one stays.
#
# the question is picking the right object among distractors, not surviving random textures.
#
# path on the machine: task_config/demo_distractor.yml
# confirm ACT_TASK_CFG=demo_distractor took effect before running; otherwise the
# multi-task chain silently falls back to demo_clean and both trains and evaluates on
# clean data without raising.
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: true
  clean_background_rate: 0
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  # both levels are needed: mesh gives shape, actor gives which object.
  # m-target masks depend entirely on actor-level ids; without this the branch is void.
  mesh_segmentation: true
  actor_segmentation: true
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
